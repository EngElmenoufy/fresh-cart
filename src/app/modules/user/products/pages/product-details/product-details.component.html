<section>
  @if (product._id) {
  <div class="grid md:grid-cols-12 not-md:grid-rows-2 gap-8 md:items-center">
    <div class="md:col-span-4 w-full row-span-1 overflow-auto p-2">
      <owl-carousel-o [options]="imagesSliderOptions">
        @for (img of product.images; track $index) {
        <ng-template carouselSlide [id]="product._id">
          <img [src]="img" [alt]="product.title" [title]="product.slug" class="w-full object-contain">
        </ng-template>
        }
      </owl-carousel-o>
    </div>

    <div class="row-span-1 md:col-span-8 p-2 overscroll-auto">
      <h2 class="text-3xl font-bold mb-2">{{product.title}}</h2>
      <p>{{product.description}}</p>

      <div class="my-3 flex justify-between items-center">
        <span class="text-xl font-bold">{{product.price| currency:'GBP'}}</span>

        <span>
          <i class="fa-solid fa-star text-yellow-400"></i>
          {{product.ratingsAverage}}
        </span>
      </div>

      <div class="flex flex-col sm:flex-row gap-4 items-center">
        <button class="btn w-full" (click)="onAddToCart()">Add To Cart</button>
        <button class="btn-secondary w-full" (click)="onAddToWishlist()">Add To Wishlist</button>
      </div>
    </div>
  </div>
  }
</section>
