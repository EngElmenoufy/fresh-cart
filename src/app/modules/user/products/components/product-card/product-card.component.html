<app-card (clickCard)="onClickedProduct($event)">
  <div class="h-72 overflow-hidden">
    <img [src]="product.imageCover" class="w-full h-full object-cover object-center" [alt]="product.title">
  </div>

  <button (click)="onAddOrRemoveProductToWishlist()"
    class="absolute -top-10 group-hover:top-2 transition-all text-xl right-2 w-10 h-10 rounded-full bg-white hover:shadow-lg cursor-pointer">
    @if (isProductInWishlist) {
    <i class="fa-solid fa-heart text-red-600"></i>
    } @else {
    <i class="fa-solid fa-heart text-primary"></i>
    }
  </button>

  <div class="p-3">
    <h4 class="text-gray-600">{{product.category.name}}</h4>
    <p class="text-xl font-semibold line-clamp-1" [title]="product.title">{{product.title}}</p>
    <div class="my-2 flex justify-between items-center">
      <span class="text-xl font-bold">{{product.price | currency:'GBP'}}</span>

      <span>
        <i class="fa-solid fa-star text-yellow-400"></i>
        {{product.ratingsAverage}}
      </span>
    </div>

    <button class="btn w-full" (click)="onAddToCart()">Add To Cart</button>
  </div>
</app-card>
